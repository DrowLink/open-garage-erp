[project]
name = "open-garage-erp"
version = "0.1.0"
description = "Open-source ERP foundation for automotive repair shops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Garage ERP Contributors" }]
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.142.2",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_garage_erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Using .*httpx.*starlette.testclient.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
